<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lizgram</title>
  </head>
  <body>
    <main class="container">
      <div class="img-insta">
        <img src="./assets/main-foto.png" alt="Imagem principal" />
      </div>

      <div class="act-insta">
        <div class="login-panel">
          <div class="logo">
            <img src="assets/logo.png" alt="" />
          </div>
          <form>
            <input type="text" placeholder="Telefone, usuario ou email" name="username"> <br>
            <input type="password" placeholder="Senha" name="password"> <br>
 
            <input type="submit" value="Entrar">
          </form>
        </div>

        <div class="info-box">
          <p>
            Não tem uma conta? <a href="#">Cadastre-se</a>
          </p>
        </div>

        <div class="get-app-panel">
          Obtenha o aplicativo
          <div class="app-download">
            <a href="#">
              <img src="assets/appstore.png" alt="app-store">
            </a>

            <a href="#">
              <img src="assets/googleplay.png" alt="app-store">
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
