<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <title>Page Login</title>
    </head>
    <body>
        <main class="container">
            <section class="container-left">
                <div class="container-form">
                    <h2>Minha Conta</h2>
                    <form>
                        <div class="inputs">
                            <input type="email" placeholder="Nome completo" />
                            <input
                                type="password"
                                placeholder="Nome completo"
                            />
                        </div>

                        <div class="button-enviar">
                            <input type="submit" value="Acessar" />
                        </div>
                    </form>
                    <p class="text-login">
                        <span>Novo por aqui?</span>
                        <a href="./index.html">Cadastre-se.</a>
                    </p>
                </div>
            </section>

            <section class="container-right">
                <div class="container-info">
                    <div class="img">
                        <img src="assets/info.png" alt="info" />
                    </div>
                    <div class="text-info">
                        <h2>Leve sua carreira ao próximo nivel</h2>
                        <p>
                            Lorem ipsum dolor sit amet consectetur adipisicing
                            elit. Nisi ullam ut voluptate quasi facilis sapiente
                            tenetur excepturi, possimus obcaecati. Alias.
                        </p>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
