<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Positions</title>
  </head>
  <body>
    <div class="container">
      <h1>Bem vindos ao meu site!</h1>
      <p>Esse é um site que está sendo desenvolvido</p>
    </div>

      Essa é uma div qualquer

        Esse conteúdo está na div com "relative"

      Conteudo fixo na tela
    </div>
    <div class="area-sticked">
      Conteudo com position sticky
    </div>
  </body>
</html>
