<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datalist</title>
  </head>
  <body>
    <h1>Trabalhando com datalist</h1>

    <form>
      <input list="carros" name="carro" placeholder="Procure por seu carro">
      <datalist id="carros">
        <option value="Fusca"></option>
        <option value="Lamborguini"></option>
        <option value="Ferrari"></option>
        <option value="Camaro"></option>
      </datalist>
    </form>
  </body>
</html>
