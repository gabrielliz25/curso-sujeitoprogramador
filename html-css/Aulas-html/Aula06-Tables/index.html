<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Trabalhando com tables</h1>

    <table>
        <caption>Lista dos funcionários</caption>

        <tr>
            <th>Nomes</th>
            <th>Idade</th>
            <th>Setor</th>
        </tr>
        
        <!-- Cada funcionario é uma <tr> -->
        <tr>
            <td>Gabriel</td>
            <td>19</td>
            <td>Financeiro</td>
        </tr>

        <tr>
            <td>Ana Júlia</td>
            <td>20</td>
            <td>Compras</td>
        </tr>

        <tr>
            <td>Pedro</td>
            <td>30</td>
            <td>Administrativo</td>
        </tr>
    </table>
</body>
</html>
